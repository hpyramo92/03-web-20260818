<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="funcionalidade.js"></script>
    <title>Meu Site</title>
    <script src="https://kit.fontawesome.com/ec3a3fcdd8.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/home/estilo.css">
    <script src="./assets/js/menuHamburguer.js"></script>
    <script src="./assets/js/home.js" type="module"></script>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <header>
        <div id="logoDoSite" class="logo">H</div>
        <h1 class="titulo">Meu Site de Notícias</h1>
        <div 
            class="menu-hamburguer"
            onClick="alternarVisualizacaoDoMenuLateral()"
        >
            <i id="hamburguer" class="fa-solid fa-bars"></i>
        </div>
    </header>
    <section>
        <nav>
            <ul class="menu-lateral">
                <li id="opcao-noticia">
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-newspaper"></i>
                            </div>
                            <div class="rotulo">Notícia</div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <div class="rotulo">Mensagem</div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="rotulo">Perfil</div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            </div>
                            <div class="rotulo">Sair</div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="./pricingBootstrap.html">
                        <div class="opcao">
                            <div class="icone-inicial">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            </div>
                            <div class="rotulo">Site de preços (Usando bootstrap)</div>
                            <div class="icone-final">
                                <i class="fa-solid fa-chevron-right"></i>
                            </div>
                        </div>
                    </a>
                </li>
            </ul>
        </nav>
        <main id="noticias" class="container">
            
        </main>
    </section>
    <footer>&copy, Meu Site, 2026, 😊</footer>
