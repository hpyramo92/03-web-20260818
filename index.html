<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/estilo.css">
    <script src="funcionalidade.js"></script>
    <title>Meu Site</title>
</head>

<body>
    <header>
        <div id="logoDoSite" class="logo">H</div>
        <h1 class="titulo">Meu Site de Notícias</h1>
    </header>
    <section>
        <nav>Menu Lateral</nav>
        <main id="noticias" class="container">
            <div class="cartao">
                <img class="imagem-do-cartao" src="./assets/img/mobilidade.png"
                    alt="imagem de ônibus nas ruas">
                <section class="corpo-do-cartao">
                    <h1 class="titulo-do-cartao">Mobilidade Urbana</h1>
                    <p class="classificacao">
                        <span class="categoria-da-noticia">Transporte</span>
                        <span class="data-da-noticia">05/03/2026</span>
                    </p>
                    <p class="descricao-da-noticia">
                        Prefeitura lança novo plano de mobilidade urbana.
                    </p>
                    <p class="autor-da-noticia">Ana Maria Pires</p>
                </section>
                <a href="#" class="botao-do-cartao">Leia mais</a>
            </div>
        </main>
    </section>
    <footer>&copy, Meu Site, 2026, 😊</footer>
</body>

</html>
